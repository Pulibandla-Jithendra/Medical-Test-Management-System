spring.application.name=medicore
server.port=${PORT:${SERVER_PORT:8080}}
server.forward-headers-strategy=framework

# Comma-separated HTTPS/HTTP origins. Set MEDICORE_CORS_ALLOWED_ORIGINS in production.
medicore.cors.allowed-origins=${MEDICORE_CORS_ALLOWED_ORIGINS:http://localhost:4173}

# MySQL settings. Supply MEDICORE_DB_PASSWORD through the environment; no credential is committed.
spring.datasource.url=${MEDICORE_DB_URL:jdbc:mysql://localhost:3307/medicore_db?serverTimezone=UTC}
spring.datasource.username=${MEDICORE_DB_USERNAME:medicore_app}
spring.datasource.password=${MEDICORE_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${MEDICORE_DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.pool-name=MediCorePool

medicore.security.jwt-secret=${MEDICORE_JWT_SECRET:}
medicore.security.cookie-secure=${MEDICORE_COOKIE_SECURE:false}
medicore.security.access-token-minutes=15
medicore.security.refresh-token-days=30
medicore.reports.storage-directory=${MEDICORE_REPORT_STORAGE_DIR:./storage/reports}
medicore.consent.text-version=${MEDICORE_CONSENT_TEXT_VERSION:v1}
medicore.bootstrap.admin-enabled=${MEDICORE_BOOTSTRAP_ADMIN_ENABLED:false}
medicore.bootstrap.admin-email=${MEDICORE_BOOTSTRAP_ADMIN_EMAIL:}
medicore.bootstrap.admin-password=${MEDICORE_BOOTSTRAP_ADMIN_PASSWORD:}
medicore.demo.seed-enabled=${MEDICORE_DEMO_SEED_ENABLED:false}
medicore.demo.password=${MEDICORE_DEMO_PASSWORD:}

# Flyway owns schema changes. Hibernate is validation-only and cannot modify the schema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=MediCore
info.app.description=Medical Test Management System
